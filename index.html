<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Blocos | PDIV</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon/favicon.svg">
    <link rel="stylesheet" type="text/css" href="./style.css">

    <!-- Carregamento de bibliotecas -->
    <script src="./libraries/p5.min.js"></script>
    <script src="./libraries/p5.sound.min.js"></script>
</head>
<body>
    <main id="app">
        <div id="game-area">
            <div id="canvas-container"></div>
            <div id="instructions">
                <strong>Dicas:</strong>
                <ul>
                    <li>Para reduzir o número de toques na raquete, mova o rato com força</li>
                    <li>Utilize a linha de trajetória para planear os seus movimentos</li>
                </ul>
            </div>
        </div>

        <aside id="sidebar">
            <div class="info-box">
                <p class="info-item"><strong>Nível:</strong> <span id="ui-level">1</span></p>
                <br>
                <p class="info-item"><strong>Score:</strong> <span id="ui-score">0</span></p>
                <br>
                <p class="info-item"><strong>Vidas:</strong> <span id="ui-lives">3</span></p>
                <br>
                <p class="info-item"><strong>Toques:</strong> <span id="ui-hits">0</span></p>
                <br>
                <p class="info-item"><strong>Jogador:</strong> <span id="ui-player">---</span></p>
            </div>
        </aside>
    </main>

    <!-- Load do jogo (scripts colocados no fim para garantir DOM) -->
    <script src="./pages/menu-screen.js" defer></script>
    <script src="./pages/player-setup-screen.js" defer></script>
    <script src="./pages/level-transition-screen.js" defer></script>
    <script src="./pages/game-screen.js" defer></script>
    <script src="./pages/gameover-screen.js" defer></script>
    <script src="./assets/components/ball.js" defer></script>
    <script src="./assets/components/paddle.js" defer></script>
    <script src="./assets/components/particle.js" defer></script>
    <script src="./assets/components/block.js" defer></script>
    <script src="sketch.js" defer></script>
</body>
</html>
